[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noteduration"
version = "0.1.0"
description = "音符时值练习：全音符到十六分音符、附点、拍号与小节补全"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "music", "rhythm", "note-value", "worksheet", "printable"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
noteduration = "noteduration.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/noteduration"
Source = "https://github.com/eastyou/noteduration"

[tool.setuptools]
packages = ["noteduration"]
